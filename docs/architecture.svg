<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Governed refund agents architecture">
  <rect width="1100" height="640" fill="#0f172a"/>
  <text x="40" y="40" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="18">Governed Refund Agents - local architecture</text>
  <text x="40" y="68" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="14">LLM is an evidence engine. OPA is the only routing authority. No auto-deny.</text>

  <rect x="40" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="130" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="16">Customer form</text>
  <text x="140" y="152" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">refund-api :8000</text>

  <rect x="300" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="400" y="130" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="16">RabbitMQ</text>
  <text x="400" y="152" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">case-events / DLQ</text>

  <rect x="560" y="90" width="260" height="200" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="690" y="120" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="16">case-worker graph</text>
  <text x="690" y="145" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">guards / collector / specialists</text>
  <text x="690" y="165" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">freeze bundle / proposer / critic</text>
  <text x="690" y="195" text-anchor="middle" fill="#c4b5fd" font-family="Helvetica, Arial, sans-serif" font-size="13">tools via MCP only</text>
  <text x="690" y="220" text-anchor="middle" fill="#c4b5fd" font-family="Helvetica, Arial, sans-serif" font-size="13">proposer/critic hold no tools</text>
  <text x="690" y="255" text-anchor="middle" fill="#fbbf24" font-family="Helvetica, Arial, sans-serif" font-size="13">gate.py to OPA</text>

  <rect x="40" y="320" width="480" height="90" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="280" y="350" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="16">MCP servers (process + credential isolated)</text>
  <text x="120" y="380" text-anchor="middle" fill="#6ee7b7" font-family="Helvetica, Arial, sans-serif" font-size="13">commerce :9101</text>
  <text x="280" y="380" text-anchor="middle" fill="#6ee7b7" font-family="Helvetica, Arial, sans-serif" font-size="13">evidence :9102</text>
  <text x="440" y="380" text-anchor="middle" fill="#6ee7b7" font-family="Helvetica, Arial, sans-serif" font-size="13">policy :9103</text>

  <rect x="560" y="320" width="200" height="90" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="660" y="355" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="16">OPA Rego gate</text>
  <text x="660" y="380" text-anchor="middle" fill="#fde68a" font-family="Helvetica, Arial, sans-serif" font-size="13">ALLOW_AUTO | ESCALATE</text>

  <rect x="800" y="320" width="240" height="90" rx="10" fill="#1e293b" stroke="#f87171"/>
  <text x="920" y="355" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="16">executor</text>
  <text x="920" y="380" text-anchor="middle" fill="#fca5a5" font-family="Helvetica, Arial, sans-serif" font-size="13">ledger - only money mover</text>

  <rect x="40" y="460" width="200" height="70" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="140" y="490" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15">Postgres + pgvector</text>
  <text x="140" y="512" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">cases / audit chain / policy</text>

  <rect x="280" y="460" width="200" height="70" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="380" y="490" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15">MinIO</text>
  <text x="380" y="512" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">photos / hashed bundles</text>

  <rect x="560" y="460" width="200" height="70" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="660" y="490" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15">Model Garden</text>
  <text x="660" y="512" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">LiteLLM gateway</text>

  <rect x="800" y="460" width="240" height="70" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="920" y="490" text-anchor="middle" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15">/review dashboard</text>
  <text x="920" y="512" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">queue / override / kill switch</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="240" y1="135" x2="300" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="135" x2="560" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="290" x2="690" y2="320" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="365" x2="800" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="290" x2="280" y2="320" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="40" y="590" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="13">Single-authority invariant: exactly one node produces terminal routing - the OPA gate.</text>
  <text x="40" y="612" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="13">Outcome has no DENY. Denials are human-only (reject_requires_human).</text>
</svg>
